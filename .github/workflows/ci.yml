name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: 构建产物只能包含 index.html 与 assets/
        run: |
          extra=$(ls -A dist | grep -v -x -e index.html -e assets || true)
          if [ -n "$extra" ]; then echo "dist 中有多余文件: $extra"; exit 1; fi
