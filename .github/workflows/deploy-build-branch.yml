name: Deploy Build Branch

# main 更新后把构建产物（index.html + assets/）推到 build 分支，供 CFSM 主题地址引用
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - package.json
      - package-lock.json
      - index.html
      - vite.config.ts
      - tsconfig*.json
      - src/**
      - public/**

concurrency:
  group: deploy-build-branch
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

      - name: Push dist to build branch
        run: |
          VERSION=$(node -p "require('./package.json').version")
          SHA=$(git rev-parse --short HEAD)
          cp -r dist /tmp/dist-build

          git config user.name github-actions
          git config user.email github-actions@github.com

          if git ls-remote --exit-code --heads origin build; then
            git fetch origin build:refs/remotes/origin/build
            git worktree add -B build /tmp/build-branch origin/build
          else
            git worktree add --detach /tmp/build-branch
            cd /tmp/build-branch
            git switch --orphan build
          fi

          cd /tmp/build-branch
          git rm -r -q --ignore-unmatch .
          cp -r /tmp/dist-build/. .
          git add -A
          git commit --allow-empty -m "chore: build v${VERSION} (${SHA})"
          git push origin build
